[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sweden-mushroom-habitat"
version = "1.0.0"
description = "Интерактивная карта грибных биотопов Швеции"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]